name: Maintain monthly rollup

on:
  workflow_dispatch:
    inputs:
      month:
        { description: "Month YYYY-MM (blank = last completed)", default: "" }
      upload:
        { description: "Publish to HuggingFace", type: boolean, default: false }
  schedule:
    - cron: "0 3 4 * *"

permissions: { contents: read }
concurrency: { group: maintain-rollup, cancel-in-progress: false }

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REPO: kshitijrajsharma/osmsg-history
      OSMSG_MAINTAIN_WORKERS: "3"
      OSMSG_DUCKDB_PRESERVE_ORDER: "false"
      OSMSG_DUCKDB_MEMORY_LIMIT: "12GB"
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          {
            tool-cache: true,
            large-packages: true,
            docker-images: true,
            swap-storage: false,
          }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen --no-dev
      - if: ${{ env.UPLOAD == 'true' }}
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: uvx --from huggingface_hub hf download "$REPO" rollup/hashtag_changeset/data.parquet rollup/users/data.parquet --repo-type dataset --local-dir "$RUNNER_TEMP/out"
      - env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", IN: "${{ inputs.month }}" }
        run: |
          export OSMSG_DUCKDB_TEMP_DIR="$RUNNER_TEMP/ducktmp"
          M="${IN:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          if [ "$UPLOAD" = "true" ]; then pub="--repo $REPO"; else pub="--no-upload"; fi
          uv run osmsg maintain month "$M" $pub --work-dir "$RUNNER_TEMP/work" --output-dir "$RUNNER_TEMP/out"
      - if: always()
        run: find "$RUNNER_TEMP/out" -name '*.parquet' -exec ls -lh {} \; >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
