services:
  db:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    # Parallel aggregates allocate DSM segments in /dev/shm; the 64MB Docker default overflows.
    shm_size: 512m
    environment:
      POSTGRES_USER: osmsg
      POSTGRES_PASSWORD: osmsg
      POSTGRES_DB: osmsg
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c random_page_cost=1.1
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=4
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osmsg -d osmsg"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4096M
        reservations:
          memory: 1024M
    restart: unless-stopped

  api:
    image: ghcr.io/osgeonepal/osmsg-api:latest
    environment:
      DATABASE_URL: postgresql://osmsg:osmsg@db:5432/osmsg
      OSMSG_QUERY_CACHE_DIR: ${OSMSG_QUERY_CACHE_DIR:-}
      OSMSG_PG_WORK_MEM: ${OSMSG_PG_WORK_MEM:-96MB}
      OSMSG_GLOBAL_MAX_DAYS: ${OSMSG_GLOBAL_MAX_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 256M
    restart: unless-stopped

  worker:
    image: ghcr.io/osgeonepal/osmsg-worker:latest
    environment:
      DATABASE_URL: postgresql://osmsg:osmsg@db:5432/osmsg
      OSMSG_SCHEDULE: ${OSMSG_SCHEDULE:-*/2 * * * *}
      OSMSG_BOOTSTRAP: ${OSMSG_BOOTSTRAP:-hour}
      OSMSG_BOOTSTRAP_DAYS: ${OSMSG_BOOTSTRAP_DAYS:-}
      OSMSG_MAX_UPDATE_WINDOW_HOURS: ${OSMSG_MAX_UPDATE_WINDOW_HOURS:-}
      OSM_USERNAME: ${OSM_USERNAME:-}
      OSM_PASSWORD: ${OSM_PASSWORD:-}
      OSMSG_EXTRA_ARGS: ${OSMSG_EXTRA_ARGS:-}
      OSMSG_DUCKDB_MEMORY_LIMIT: ${OSMSG_DUCKDB_MEMORY_LIMIT:-1GB}
      OSMSG_DUCKDB_THREADS: ${OSMSG_DUCKDB_THREADS:-2}
      OSMSG_DUCKDB_TEMP_DIR: ${OSMSG_DUCKDB_TEMP_DIR:-/var/cache/osmsg/duckdb-tmp}
    volumes:
      - osmsg-data:/var/lib/osmsg
      - osmsg-cache:/var/cache/osmsg
    ulimits:
      core: 0
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          memory: 256M
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/leaderboard:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 96M
        reservations:
          memory: 32M
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/mnt/osmsg/pgdata
  osmsg-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/mnt/osmsg/data
  osmsg-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/mnt/osmsg/cache
  caddy-data:
  caddy-config:
